name: Documentation

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    steps:
        - uses: actions/checkout@v3
        
        - uses: julia-actions/setup-julia@v2
          with:
            version: "1"

        - name: Use Julia cache
          uses: julia-actions/cache@v2



        - name: Add Cosmonstants to environment
          run: |
            git clone https://github.com/rafaelab/Cosmonstants.jl.git
            julia --startup-file=no --project -e '
              using Pkg; Pkg.develop(path = "Cosmonstants.jl")
              Pkg.instantiate()'

        - name: Install dependencies
          run: |
            julia --startup-file=no --project=docs -e '
              using Pkg
              Pkg.develop(path = ".")
              Pkg.instantiate()'

        - name: Build and deploy documentation
          run: julia --startup-file=no --project=docs docs/make.jl
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        # GITHUB_TOKEN pushes do not automatically trigger a Pages build.
        - name: Publish GitHub Pages
          if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
          run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"
          env:
            GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
